# =====================================================================
#  Системы в стиле ReallyWorld / FunTime / HolyWorld
# =====================================================================

# Аукцион /ah. Налог с продажи (%) списывается с продавца — это «сжигание» денег в экономике.
auction:
  max-lots-per-player: 7
  duration-hours: 48
  min-price: 1
  max-price: 100000000
  tax-percent: 5

# Режим боя: после удара по игроку — таймер, запрет команд, смерть при выходе из игры.
combat:
  enabled: true
  seconds: 15
  kill-on-logout: true
  blocked-commands: [spawn, home, homes, tpa, tpahere, tpaccept, tpr, rtp, wild, warp, warps, back, ah, auction, auc, menu, m, gui, ec, enderchest, kit, kits]

# Кланы /clan
clans:
  create-cost: 5000
  max-members: 15
  friendly-fire: false
  tag-format: "&8[&#ffb347{tag}&8] "
  help:
    - "&#ffb347&lКланы &8— &7команды:"
    - " &e/clan create <тег> [название] &7— создать клан (5000$)"
    - " &e/clan invite <ник> &7— пригласить, &e/clan kick <ник> &7— выгнать"
    - " &e/clan accept &7/ &e/clan deny &7— принять или отклонить приглашение"
    - " &e/clan info [тег] &7— информация, &e/clan top &7— топ кланов"
    - " &e/clan leave &7— выйти, &e/clan disband confirm &7— распустить"
    - " &e/cc <текст> &7— клановый чат. Соклановцы не наносят друг другу урон."

# Ивент «Мистический сундук» (аирдроп): появляется в мире по таймеру.
events:
  enabled: true
  world: world
  interval-minutes: 60
  min-players: 2
  unlock-seconds: 120
  open-minutes: 10
  min-distance: 300
  max-distance: 1500
  # item — материал, chance — шанс в %, min/max — количество
  loot:
    - {item: DIAMOND, chance: 70, min: 2, max: 6}
    - {item: GOLDEN_APPLE, chance: 60, min: 1, max: 4}
    - {item: ENCHANTED_GOLDEN_APPLE, chance: 8, min: 1, max: 1}
    - {item: EXPERIENCE_BOTTLE, chance: 80, min: 8, max: 32}
    - {item: ENDER_PEARL, chance: 60, min: 2, max: 8}
    - {item: IRON_INGOT, chance: 90, min: 8, max: 24}
    - {item: GOLD_INGOT, chance: 70, min: 4, max: 16}
    - {item: EMERALD, chance: 50, min: 4, max: 12}
    - {item: NETHERITE_SCRAP, chance: 12, min: 1, max: 2}
    - {item: TOTEM_OF_UNDYING, chance: 10, min: 1, max: 1}
    - {item: SHULKER_SHELL, chance: 15, min: 1, max: 2}
    - {item: NAME_TAG, chance: 30, min: 1, max: 2}
    - {item: SADDLE, chance: 25, min: 1, max: 1}
    - {item: ENCHANTED_BOOK, chance: 35, min: 1, max: 2}
    - {item: BLAZE_ROD, chance: 40, min: 2, max: 6}

# Общественная шахта (/warp mine): кубоид ниже заполняется рудой каждые reset-minutes
mine:
  enabled: true
  world: world
  min: [-10, 85, 110]
  max: [10, 99, 130]
  safe-spot: [0, 101, 104]
  reset-minutes: 10
  composition:
    STONE: 52
    ANDESITE: 6
    COAL_ORE: 13
    IRON_ORE: 10
    COPPER_ORE: 7
    GOLD_ORE: 3.5
    REDSTONE_ORE: 3.5
    LAPIS_ORE: 3
    DIAMOND_ORE: 1.2
    EMERALD_ORE: 0.8
