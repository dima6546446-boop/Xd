    builder:     { display: "&6[Строитель]",                hours: 25,  icon: BRICKS }
    veteran:     { display: "&#c0c0c0[Ветеран]",            hours: 50,  icon: IRON_CHESTPLATE }
    oldfag:      { display: "&#d4af37[Старожил]",           hours: 100, icon: CLOCK }
    ancient:     { display: "&#8a2be2[Древний]",            hours: 250, icon: ANCIENT_DEBRIS }
    star:        { display: "&e[★]",                        permission: clindercore.tag.vip,       icon: NETHER_STAR }
    cyber:       { display: "&#00ffd5[Кибер]",              permission: clindercore.tag.premium,   icon: PRISMARINE_SHARD }
    shadow:      { display: "&#7d7d7d[Тень]",               permission: clindercore.tag.elite,     icon: BLACK_DYE }
    fire:        { display: "&#ff4e00[Пламя]",              permission: clindercore.tag.legend,    icon: BLAZE_POWDER }
    demon:       { display: "&#ff1a1a[☠ Демон]",            permission: clindercore.tag.titan,     icon: WITHER_SKELETON_SKULL }
    crown:       { display: "&#ffaa00[♛ Корона]",           permission: clindercore.tag.imperator, icon: GOLDEN_HELMET }
    divine:      { display: "&#00e5ff[⚡ Божество]",         permission: clindercore.tag.god,       icon: TRIDENT }
