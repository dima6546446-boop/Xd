# =====================================================================
#  Кейсы /cases. Ключи — виртуальные. Выдать ключи: /cases give <ник> <кейс> <кол-во>
#  (эту же команду указывайте в магазине доната, например в Tebex: cases give {username} donate 1).
#  weight — вес (шанс = вес / сумма весов, игрок видит шансы по ПКМ).
#  Награда: money, item+amount, commands (от консоли, {player} — ник), keys (ключи других кейсов).
#  unless-permission + fallback-keys — защита от дубликата косметики.
#  ВАЖНО: донатный кейс содержит ТОЛЬКО косметику (временные ранги, титулы, частицы) — по правилам Minecraft.
