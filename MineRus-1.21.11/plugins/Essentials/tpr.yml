# Configuration for the random teleport command.
# Use the /settpr command in-game to set random teleport locations.

default-location: '{world}'
excluded-biomes:
- cold_ocean
- deep_cold_ocean
- deep_frozen_ocean
- deep_lukewarm_ocean
- deep_ocean
- deep_warm_ocean
- frozen_ocean
- frozen_river
- lukewarm_ocean
- ocean
- river
- warm_ocean
locations:
  world:
    center:
      world: bb69357b-9211-47cf-b8f4-97c769439726
      world-name: world
      x: 0.5
      y: 101.0
      z: 14.5
      yaw: -180.0
      pitch: -0.0
    min-range: 300.0
    max-range: 3000.0
